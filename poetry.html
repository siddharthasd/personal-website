<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poetry — Siddhartha Dhamankar</title>
<style>
:root {
  --gold:          #C49A1A;
  --gold-light:    #E8D5A0;
  --gold-pale:     #F5EDCE;
  --ink:           #1C1712;
  --parchment:     #FAF7F0;
  --parchment-mid: #F2EBE0;
  --parchment-warm:#EDE4D4;
  --text:          #2A2118;
  --text-muted:    #6B5848;
  --violet:        #A89BC9;
  --violet-dark:   #6B5A9E;
  --border:        #D4C9B0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; }

body {
  background: var(--parchment);
  color: var(--text);
  font-family: Georgia, 'Times New Roman', serif;
  opacity: 0;
  transition: opacity 0.7s ease;
}
body.loaded { opacity: 1; }

/* ─── HEADER ──────────────────────────────────────── */
.site-header {
  background: var(--ink);
  padding: 16px 48px;
  position: relative;
  overflow: hidden;
}
.site-header::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(0deg,  transparent, transparent 19px, rgba(196,154,26,0.05) 20px),
    repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(196,154,26,0.05) 20px);
  pointer-events: none;
}
.header-inner {
  position: relative; z-index: 1;
  display: flex;
  align-items: center;
  gap: 16px;
}
.medallion-link { display: flex; flex-shrink: 0; }
.medallion { width: 48px; height: 48px; }
.brand-text { flex: 1; }
.page-title {
  font-family: Georgia, serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--gold-light);
  letter-spacing: 0.07em;
  line-height: 1.2;
}
.page-subtitle {
  font-family: Georgia, serif;
  font-size: 11px;
  color: rgba(232,213,160,0.5);
  letter-spacing: 0.2em;
  font-style: italic;
  margin-top: 2px;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold-light);
  text-decoration: none;
  border: 1px solid rgba(196,154,26,0.35);
  padding: 5px 12px;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
  flex-shrink: 0;
}
.back-link:hover {
  background: rgba(196,154,26,0.15);
  border-color: rgba(196,154,26,0.7);
  color: #fff;
}
.back-link::before { content: '←'; font-size: 13px; }

/* ─── POEM NAV (sticky jump bar) ─────────────────── */
.poem-nav-bar {
  background: var(--parchment-mid);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 0 40px;
  overflow-x: auto;
  scrollbar-width: none;
}
.poem-nav-bar::-webkit-scrollbar { display: none; }

.poem-nav {
  display: flex;
  align-items: stretch;
  gap: 0;
  white-space: nowrap;
}

.poem-nav a {
  display: inline-block;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-muted);
  text-decoration: none;
  padding: 14px 20px;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
  flex-shrink: 0;
}
.poem-nav a:hover {
  color: var(--text);
  border-bottom-color: var(--gold);
}
.poem-nav a.is-active {
  color: var(--ink);
  border-bottom-color: var(--gold);
}

/* ─── MAIN CONTENT ────────────────────────────────── */
.site-main {
  max-width: 680px;
  margin: 0 auto;
  padding: 72px 40px 80px;
}

/* ─── BAROQUE ORNAMENTAL DIVIDER ─────────────────── */
.baroque-divider {
  text-align: center;
  margin: 64px 0 56px;
  position: relative;
}
.baroque-divider::before {
  content: '';
  display: block;
  position: absolute;
  top: 50%;
  left: 0; right: 0;
  height: 1px;
  background: var(--border);
}
.baroque-divider svg {
  position: relative;
  background: var(--parchment);
  padding: 0 20px;
}
.baroque-divider:first-child { margin-top: 0; }

/* ─── POEM CARD ───────────────────────────────────── */
.poem-card {
  scroll-margin-top: 60px;
}

.poem-header {
  text-align: center;
  margin-bottom: 40px;
}

.poem-ornament { margin-bottom: 20px; }

.poem-title {
  font-family: Georgia, serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.04em;
  line-height: 1.3;
  margin-bottom: 10px;
}

.poem-year {
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
}

/* ─── POEM BODY ───────────────────────────────────── */
.poem-body {
  background: var(--parchment-mid);
  border: 1px solid var(--border);
  padding: 44px 52px;
  position: relative;
}

/* Gold corner brackets */
.poem-body::before,
.poem-body::after {
  content: '';
  position: absolute;
  width: 22px; height: 22px;
  border-color: var(--gold);
  border-style: solid;
  opacity: 0.5;
}
.poem-body::before { top: 8px; left: 8px; border-width: 1.5px 0 0 1.5px; }
.poem-body::after  { bottom: 8px; right: 8px; border-width: 0 1.5px 1.5px 0; }

/* Stanza */
.stanza {
  font-family: Georgia, serif;
  font-size: 17px;
  line-height: 2;
  color: var(--text);
  margin-bottom: 32px;
  font-style: normal;
}
.stanza:last-child { margin-bottom: 0; }

/* Indented lines (used in the eulogy) */
.stanza .indent {
  display: block;
  padding-left: 1.5em;
}

/* Forthcoming placeholder */
.poem-forthcoming {
  font-family: Georgia, serif;
  font-size: 15px;
  font-style: italic;
  color: var(--text-muted);
  text-align: center;
  padding: 8px 0;
}

/* ─── FOOTER ──────────────────────────────────────── */
.site-footer {
  background: var(--ink);
  color: rgba(232,213,160,0.5);
  text-align: center;
  padding: 40px;
  font-family: Georgia, serif;
  font-size: 13px;
  font-style: italic;
  letter-spacing: 0.07em;
  line-height: 2.2;
}
.site-footer a { color: rgba(232,213,160,0.7); text-decoration: none; }
.site-footer a:hover { color: var(--gold-light); }
.footer-rule { width: 80px; height: 1px; background: rgba(196,154,26,0.3); margin: 14px auto; }

/* Loading state */
.loading-msg {
  font-family: Georgia, serif;
  font-size: 15px;
  font-style: italic;
  color: var(--text-muted);
  text-align: center;
  padding: 80px 0;
}

/* ─── RESPONSIVE ──────────────────────────────────── */
@media (max-width: 600px) {
  .site-main    { padding: 48px 20px 64px; }
  .poem-body    { padding: 32px 28px; }
  .poem-title   { font-size: 22px; }
  .stanza       { font-size: 16px; }
  .poem-nav-bar { padding: 0 16px; }
  .poem-nav a   { padding: 14px 12px; }
}
</style>

     POEMS
══════════════════════════════════════ -->

  <p class="loading-msg">Loading verse&hellip;</p>

</footer>


<script>
(function () {
  'use strict';

  const REPO   = 'siddharthasd/personal-website';
  const MINOR  = new Set(['a','an','the','on','of','in','from','at','by','for','with','and','but','or']);

  const ORNAMENT = `<svg width="80" height="26" viewBox="0 0 80 26" aria-hidden="true">
    <path d="M8,13 Q20,3 30,13 Q40,21 50,13 Q60,3 72,13"
          fill="none" stroke="#C49A1A" stroke-width="1.2" opacity="0.7"/>
    <circle cx="8"  cy="13" r="2.5" fill="#C49A1A" opacity="0.6"/>
    <circle cx="72" cy="13" r="2.5" fill="#C49A1A" opacity="0.6"/>
    <circle cx="40" cy="14" r="2"   fill="#C49A1A" opacity="0.5"/>
  </svg>`;

  const DIVIDER = `<div class="baroque-divider" aria-hidden="true">
    <svg width="80" height="26" viewBox="0 0 80 26">
      <line x1="0"  y1="13" x2="16" y2="13" stroke="#C49A1A" stroke-width="0.7" opacity="0.45"/>
      <line x1="64" y1="13" x2="80" y2="13" stroke="#C49A1A" stroke-width="0.7" opacity="0.45"/>
      <path d="M18,13 Q28,4 40,13 Q52,22 62,13"
            fill="none" stroke="#C49A1A" stroke-width="1.1" opacity="0.65"/>
      <circle cx="40" cy="13" r="2" fill="#C49A1A" opacity="0.5"/>
    </svg>
  </div>`;

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function parseName(filename) {
    const base  = filename.replace(/\.txt$/, '');
    const parts = base.split('-');
    let yearIdx = -1;
    for (let i = parts.length - 1; i >= 0; i--) {
      if (/^\d{4}$/.test(parts[i])) { yearIdx = i; break; }
    }
    const year       = yearIdx >= 0 ? parts[yearIdx] : '';
    const titleParts = yearIdx >= 0 ? parts.slice(0, yearIdx) : parts;
    const title      = titleParts.map((w, i) =>
      (i === 0 || !MINOR.has(w)) ? w.charAt(0).toUpperCase() + w.slice(1) : w
    ).join(' ');
    return { title, year, id: base };
  }

  function parseStanzas(raw) {
    const lines = raw.split('\n').map(l => l.trimEnd());
    // skip first line if it's a title header like "The fear of death (2005)"
    const start = /\(\d{4}\)/.test(lines[0]) ? 1 : 0;
    const stanzas = [];
    let cur = [];
    for (const line of lines.slice(start)) {
      if (line.trim() === '') {
        if (cur.length) { stanzas.push(cur); cur = []; }
      } else {
        cur.push(line);
      }
    }
    if (cur.length) stanzas.push(cur);
    return stanzas;
  }

  function renderPoem(filename, text, first) {
    const { title, year, id } = parseName(filename);
    const stanzas = parseStanzas(text);
    const body = stanzas
      .map(s => `<p class="stanza">${s.map(esc).join('<br>')}</p>`)
      .join('\n      ');
    return `${first ? '' : DIVIDER}
  <article class="poem-card" id="${id}">
    <header class="poem-header">
      <div class="poem-ornament">${ORNAMENT}</div>
      <h2 class="poem-title">${esc(title)}</h2>
      <p class="poem-year">${year}</p>
    </header>
    <div class="poem-body">
      ${body}
    </div>
  </article>`;
  }

  function wireNav() {
    const links = document.querySelectorAll('.poem-nav a');

    function updateActive() {
      const y = window.scrollY + 100;
      let active = null;
      document.querySelectorAll('.poem-card').forEach(p => {
        if (p.offsetTop <= y) active = p.id;
      });
      links.forEach(l => l.classList.toggle('is-active', l.getAttribute('href') === '#' + active));
    }

    window.addEventListener('scroll', updateActive, { passive: true });
    updateActive();

    links.forEach(l => l.addEventListener('click', function (e) {
      const t = document.querySelector(this.getAttribute('href'));
      if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }));
  }

  async function load() {
    const container = document.getElementById('poem-container');
    const nav       = document.getElementById('poem-nav');
    try {
      const res   = await fetch(
        `https://api.github.com/repos/${REPO}/contents/poetry`,
        { headers: { Accept: 'application/vnd.github.v3+json' } }
      );
      if (!res.ok) throw new Error('API ' + res.status);
      const files = (await res.json())
        .filter(f => f.type === 'file' && f.name.endsWith('.txt'))
        .sort((a, b) => {
          const ya = parseName(a.name).year;
          const yb = parseName(b.name).year;
          return ya < yb ? -1 : ya > yb ? 1 : a.name.localeCompare(b.name);
        });

      if (!files.length) {
        container.innerHTML = '<p class="loading-msg">No poems found.</p>';
        return;
      }

      // Build nav
      nav.innerHTML = files.map(f => {
        const { title, id } = parseName(f.name);
        return `<a href="#${id}">${esc(title)}</a>`;
      }).join('');
      wireNav();

      // Fetch all texts in parallel then render
      const texts = await Promise.all(files.map(f => fetch(f.download_url).then(r => r.text())));
      container.innerHTML = files.map((f, i) => renderPoem(f.name, texts[i], i === 0)).join('\n');

    } catch (err) {
      container.innerHTML = '<p class="loading-msg">Could not load poems. Serve this page over HTTP to enable dynamic loading.</p>';
      console.error(err);
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.body.classList.add('loaded');
    load();
  });

}());
</script>

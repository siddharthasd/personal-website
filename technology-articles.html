<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technology articles — Siddhartha Dhamankar</title>
<style>
:root {
  --gold:          #C49A1A;
  --gold-light:    #E8D5A0;
  --ink:           #1C1712;
  --parchment:     #FAF7F0;
  --parchment-mid: #F2EBE0;
  --text:          #2A2118;
  --text-muted:    #6B5848;
  --green:         #7DBF8E;
  --green-dark:    #4E8C5F;
  --border:        #D4C9B0;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; }
body {
  background: var(--parchment);
  color: var(--text);
  font-family: Georgia, 'Times New Roman', serif;
  opacity: 0;
  transition: opacity 0.7s ease;
}
body.loaded { opacity: 1; }

/* ─── HEADER ──────────────────────────────────────── */
.site-header {
  background: var(--ink);
  padding: 16px 48px;
  position: relative;
  overflow: hidden;
}
.site-header::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(0deg,  transparent, transparent 19px, rgba(196,154,26,0.05) 20px),
    repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(196,154,26,0.05) 20px);
  pointer-events: none;
}
.header-inner {
  position: relative; z-index: 1;
  display: flex;
  align-items: center;
  gap: 16px;
}
.medallion-link { display: flex; flex-shrink: 0; }
.medallion { width: 48px; height: 48px; }
.brand-text { flex: 1; }
.page-title {
  font-family: Georgia, serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--gold-light);
  letter-spacing: 0.07em;
  line-height: 1.2;
}
.page-subtitle {
  font-family: Georgia, serif;
  font-size: 11px;
  color: rgba(232,213,160,0.5);
  letter-spacing: 0.2em;
  font-style: italic;
  margin-top: 2px;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold-light);
  text-decoration: none;
  border: 1px solid rgba(196,154,26,0.35);
  padding: 5px 12px;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
  flex-shrink: 0;
}
.back-link:hover {
  background: rgba(196,154,26,0.15);
  border-color: rgba(196,154,26,0.7);
  color: #fff;
}
.back-link::before { content: '←'; font-size: 13px; }

/* ─── MAIN ────────────────────────────────────────── */
.site-main {
  max-width: 1020px;
  margin: 0 auto;
  padding: 56px 48px 80px;
}

.loading-msg {
  font-family: Georgia, serif;
  font-size: 15px;
  font-style: italic;
  color: var(--text-muted);
  text-align: center;
  padding: 80px 0;
}

/* ─── ARTICLE GRID ────────────────────────────────── */
.articles-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 24px;
}

.article-card {
  background: #fff;
  border: 1px solid var(--border);
  border-top: 3px solid var(--gold);
  padding: 28px 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  text-decoration: none;
  color: inherit;
  transition: box-shadow 0.2s, border-top-color 0.2s;
}
.article-card:hover {
  box-shadow: 0 4px 20px rgba(28,23,18,0.1);
  border-top-color: var(--green-dark);
}
.article-num {
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 0.25em;
  text-transform: uppercase;
}
.article-title {
  font-family: Georgia, serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.45;
  flex: 1;
}
.article-rule {
  width: 32px;
  height: 1px;
  background: var(--border);
}
.article-cta {
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--green-dark);
  display: flex;
  align-items: center;
  gap: 6px;
}
.article-cta::after { content: '→'; font-size: 12px; }

/* ─── FOOTER ──────────────────────────────────────── */
.site-footer {
  background: var(--ink);
  color: rgba(232,213,160,0.5);
  text-align: center;
  padding: 44px 40px;
  font-family: Georgia, serif;
  font-size: 13px;
  font-style: italic;
  letter-spacing: 0.07em;
  line-height: 2.2;
}
.site-footer a { color: rgba(232,213,160,0.72); text-decoration: none; transition: color 0.2s; }
.site-footer a:hover { color: var(--gold-light); }
.footer-rule { width: 80px; height: 1px; background: rgba(196,154,26,0.35); margin: 16px auto; }

@media (max-width: 600px) {
  .site-header { padding: 14px 20px; }
  .site-main   { padding: 40px 20px 64px; }
  .articles-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="medallion-link" aria-label="Home">
      <svg class="medallion" viewBox="0 0 108 108" aria-label="SD monogram">
        <circle cx="54" cy="54" r="51" fill="none" stroke="#C49A1A" stroke-width="0.8" stroke-dasharray="4 3.5" opacity="0.45"/>
        <circle cx="54" cy="54" r="45" fill="none" stroke="#C49A1A" stroke-width="0.5" opacity="0.3"/>
        <circle cx="54" cy="54" r="39" fill="#3A5C42"/>
        <circle cx="54" cy="54" r="35" fill="none" stroke="#7DBF8E" stroke-width="0.7" opacity="0.45"/>
        <ellipse cx="54" cy="10"  rx="4.5" ry="7"   fill="#C49A1A" opacity="0.7"/>
        <ellipse cx="98" cy="54"  rx="7"   ry="4.5" fill="#C49A1A" opacity="0.7"/>
        <ellipse cx="54" cy="98"  rx="4.5" ry="7"   fill="#C49A1A" opacity="0.7"/>
        <ellipse cx="10" cy="54"  rx="7"   ry="4.5" fill="#C49A1A" opacity="0.7"/>
        <polygon points="23,23 26,20 29,23 26,26" fill="#C49A1A" opacity="0.5"/>
        <polygon points="79,23 82,20 85,23 82,26" fill="#C49A1A" opacity="0.5"/>
        <polygon points="79,82 82,79 85,82 82,85" fill="#C49A1A" opacity="0.5"/>
        <polygon points="23,82 26,79 29,82 26,85" fill="#C49A1A" opacity="0.5"/>
        <text x="54" y="63" text-anchor="middle"
              font-family="Georgia, serif" font-size="26" font-weight="700"
              fill="#FFFFFF" letter-spacing="3">SD</text>
      </svg>
    </a>
    <div class="brand-text">
      <h1 class="page-title">Technology articles</h1>
      <p class="page-subtitle">AI &nbsp;&middot;&nbsp; Agentic systems &nbsp;&middot;&nbsp; Future of work</p>
    </div>
    <a href="index.html" class="back-link">Home</a>
  </div>
</header>

<main class="site-main">
  <div id="articles-grid" class="articles-grid">
    <p class="loading-msg">Loading articles&hellip;</p>
  </div>
</main>

<footer class="site-footer">
  <p>Siddhartha Dhamankar &nbsp;&middot;&nbsp; Mumbai</p>
  <div class="footer-rule"></div>
  <p><a href="mailto:siddhartha.dhamankar@icloud.com">siddhartha.dhamankar@icloud.com</a></p>
</footer>

<script>
(function () {
  'use strict';

  const REPO = 'siddharthasd/personal-website';
  const ACRONYMS = { genai: 'GenAI', a2a: 'A2A', mcp: 'MCP', ai: 'AI', hr: 'HR' };
  const MINOR = new Set(['a', 'an', 'the', 'to', 'for', 'of', 'in', 'from', 'at', 'by', 'with', 'and', 'but', 'or']);

  function parseTitle(filename) {
    const base = filename.replace(/\.pdf$/, '').replace(/-v\d+$/, '');
    return base.split('-').map(function (w, i) {
      const lo = w.toLowerCase();
      if (ACRONYMS[lo]) return ACRONYMS[lo];
      if (i > 0 && MINOR.has(lo)) return lo;
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(' ');
  }

  async function load() {
    const grid = document.getElementById('articles-grid');
    try {
      const res = await fetch(
        'https://api.github.com/repos/' + REPO + '/contents/technology-articles',
        { headers: { Accept: 'application/vnd.github.v3+json' } }
      );
      if (!res.ok) throw new Error('API ' + res.status);
      const files = (await res.json())
        .filter(function (f) { return f.type === 'file' && f.name.endsWith('.pdf'); })
        .sort(function (a, b) { return a.name.localeCompare(b.name); });

      if (!files.length) {
        grid.innerHTML = '<p class="loading-msg">No articles found.</p>';
        return;
      }

      grid.innerHTML = files.map(function (f, i) {
        const title = parseTitle(f.name);
        const url   = 'article-viewer.html?f=' + encodeURIComponent(f.name);
        const num   = 'Article ' + String(i + 1).padStart(2, '0');
        return '<a href="' + url + '" class="article-card">'
          + '<span class="article-num">' + num + '</span>'
          + '<h2 class="article-title">' + title + '</h2>'
          + '<div class="article-rule"></div>'
          + '<span class="article-cta">Read article</span>'
          + '</a>';
      }).join('');

    } catch (err) {
      grid.innerHTML = '<p class="loading-msg">Could not load articles.</p>';
      console.error(err);
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.body.classList.add('loaded');
    load();
  });
}());
</script>
</body>
</html>

<style>
:root {
  --gold:           #C49A1A;
  --gold-light:     #E8D5A0;
  --gold-pale:      #F5EDCE;
  --ink:            #1C1712;
  --parchment:      #FAF7F0;
  --parchment-mid:  #F2EBE0;
  --parchment-dark: #E6DDD0;
  --text:           #2A2118;
  --text-muted:     #6B5848;
  --green:          #7DBF8E;
  --green-dark:     #4E8C5F;
  --border:         #D4C9B0;
  --mat:            #F5F0E8;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; }

body {
  background: var(--parchment);
  color: var(--text);
  font-family: Georgia, 'Times New Roman', serif;
  opacity: 0;
  transition: opacity 0.7s ease;
}
body.loaded { opacity: 1; }

/* ─── HEADER ──────────────────────────────────────── */
.site-header {
  background: var(--ink);
  padding: 16px 48px;
  position: relative;
  overflow: hidden;
}
.site-header::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(0deg,  transparent, transparent 19px, rgba(196,154,26,0.05) 20px),
    repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(196,154,26,0.05) 20px);
  pointer-events: none;
}
.header-inner {
  position: relative; z-index: 1;
  display: flex;
  align-items: center;
  gap: 16px;
}
.medallion-link { display: flex; flex-shrink: 0; }
.medallion { width: 48px; height: 48px; }
.brand-text { flex: 1; }
.page-title {
  font-family: Georgia, serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--gold-light);
  letter-spacing: 0.07em;
  line-height: 1.2;
}
.page-subtitle {
  font-family: Georgia, serif;
  font-size: 11px;
  color: rgba(232,213,160,0.5);
  letter-spacing: 0.2em;
  font-style: italic;
  margin-top: 2px;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold-light);
  text-decoration: none;
  border: 1px solid rgba(196,154,26,0.35);
  padding: 5px 12px;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
  flex-shrink: 0;
}
.back-link:hover {
  background: rgba(196,154,26,0.15);
  border-color: rgba(196,154,26,0.7);
  color: #fff;
}
.back-link::before { content: '←'; font-size: 13px; }

/* ─── FOOTER ──────────────────────────────────────── */
.site-footer {
  background: var(--ink);
  color: rgba(232,213,160,0.5);
  text-align: center;
  padding: 44px 40px;
  font-family: Georgia, serif;
  font-size: 13px;
  font-style: italic;
  letter-spacing: 0.07em;
  line-height: 2.2;
}
.site-footer a {
  color: rgba(232,213,160,0.72);
  text-decoration: none;
  transition: color 0.2s;
}
.site-footer a:hover { color: var(--gold-light); }
.footer-rule {
  width: 80px;
  height: 1px;
  background: rgba(196,154,26,0.35);
  margin: 16px auto;
}

/* ─── FILTER BAR ──────────────────────────────────── */
.filter-section {
  background: var(--parchment-mid);
  border-bottom: 1px solid var(--border);
  padding: 24px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.filter-bar {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.filter-btn {
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 7px 16px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  cursor: pointer;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
  line-height: 1;
}
.filter-btn:hover {
  border-color: var(--gold);
  color: var(--text);
}
.filter-btn.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--gold-light);
}

.gallery-count {
  font-family: Georgia, serif;
  font-size: 13px;
  font-style: italic;
  color: var(--text-muted);
  white-space: nowrap;
}

/* ─── COMING SOON NOTICE ──────────────────────────── */
.coming-soon {
  max-width: 1120px;
  margin: 0 auto;
  padding: 32px 40px 0;
  font-size: 16px;
  font-style: italic;
  color: var(--text-muted);
}

/* ─── GALLERY ─────────────────────────────────────── */
.gallery-wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 40px 64px;
}

.gallery-grid {
  column-count: 2;
  column-gap: 24px;
}

.gallery-item {
  break-inside: avoid;
  margin-bottom: 24px;
  transition: opacity 0.3s ease;
}
.gallery-item.hidden {
  display: none;
}

/* ─── PICTURE FRAME ───────────────────────────────── */
.drawing-frame {
  background: var(--mat);
  border: 1px solid var(--border);
  cursor: zoom-in;
  position: relative;
  box-shadow: 2px 3px 10px rgba(28,23,18,0.13);
  transition: box-shadow 0.25s ease, transform 0.25s ease;
}
.drawing-frame:hover {
  box-shadow: 5px 8px 24px rgba(28,23,18,0.2);
  transform: translateY(-2px);
}

/* Gold corner brackets */
.drawing-frame::before,
.drawing-frame::after {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  border-color: var(--gold);
  border-style: solid;
  opacity: 0.5;
  z-index: 2;
  pointer-events: none;
}
.drawing-frame::before { top: 6px; left: 6px; border-width: 1.5px 0 0 1.5px; }
.drawing-frame::after  { bottom: 34px; right: 6px; border-width: 0 1.5px 1.5px 0; }

/* Parchment mat around image */
.drawing-mat {
  padding: 12px 12px 10px;
  position: relative;
  overflow: hidden;
}

/* Hairline inner border on mat */
.drawing-mat::before {
  content: '';
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(196,154,26,0.18);
  pointer-events: none;
  z-index: 1;
}

.drawing-mat img {
  width: 100%;
  height: auto;
  display: block;
  filter: sepia(8%) contrast(0.97);
  transition: filter 0.3s ease;
}

/* Hover overlay */
.drawing-overlay {
  position: absolute;
  inset: 12px 12px 10px;
  background: rgba(28,23,18,0.48);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.25s ease;
}
.drawing-overlay span {
  font-family: Georgia, serif;
  font-size: 13px;
  font-style: italic;
  letter-spacing: 0.18em;
  color: var(--gold-light);
  border-bottom: 1px solid rgba(232,213,160,0.5);
  padding-bottom: 3px;
}
.drawing-frame:hover .drawing-overlay { opacity: 1; }
.drawing-frame:hover .drawing-mat img { filter: sepia(0%) contrast(1); }

/* Caption */
figcaption {
  padding: 8px 14px 12px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.caption-title {
  font-family: Georgia, serif;
  font-size: 13px;
  font-style: italic;
  color: var(--text);
}
.caption-year {
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.1em;
  white-space: nowrap;
}

/* ─── LIGHTBOX ────────────────────────────────────── */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  align-items: center;
  justify-content: center;
  background: rgba(28,23,18,0.93);
  cursor: zoom-out;
}
.lightbox.is-open { display: flex; }

.lightbox-inner {
  position: relative;
  z-index: 1;
  cursor: default;
  max-width: 90vw;
  max-height: 90vh;
}

.lightbox-frame {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.lightbox-img-wrap {
  position: relative;
  max-width: 100%;
  line-height: 0;
}

#lightbox-img {
  display: block;
  max-width: 100%;
  max-height: 80vh;
  object-fit: contain;
  box-shadow: 0 8px 48px rgba(0,0,0,0.6);
}

/* Magnifier lens */
#lightbox-img { cursor: crosshair; touch-action: none; }
.magnifier {
  display: none;
  position: absolute;
  width: min(660px, 80vw);
  height: min(660px, 80vw);
  border-radius: 50%;
  border: 2px solid var(--gold);
  box-shadow: 0 6px 24px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.25);
  background-color: var(--mat);
  background-repeat: no-repeat;
  pointer-events: none;
  z-index: 2;
}
.magnifier.is-active { display: block; }

.lightbox-hint {
  display: block;
  margin-top: 6px;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 11px;
  color: rgba(232,213,160,0.4);
  letter-spacing: 0.1em;
}

.lightbox-caption {
  text-align: center;
}

#lightbox-title {
  display: block;
  font-family: Georgia, serif;
  font-size: 16px;
  font-style: italic;
  color: var(--gold-light);
  margin-bottom: 4px;
}

#lightbox-meta {
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 12px;
  color: rgba(232,213,160,0.55);
  letter-spacing: 0.14em;
}

.lightbox-close {
  position: fixed;
  top: 20px; right: 24px;
  background: none;
  border: none;
  color: rgba(232,213,160,0.7);
  font-size: 28px;
  cursor: pointer;
  line-height: 1;
  padding: 4px 8px;
  transition: color 0.2s;
  z-index: 1001;
}
.lightbox-close:hover { color: #fff; }

.lightbox-prev,
.lightbox-next {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(28,23,18,0.5);
  border: 1px solid rgba(196,154,26,0.25);
  color: var(--gold-light);
  font-size: 22px;
  padding: 12px 16px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
  z-index: 1001;
  line-height: 1;
}
.lightbox-prev:hover,
.lightbox-next:hover {
  background: rgba(196,154,26,0.15);
  border-color: rgba(196,154,26,0.6);
}
.lightbox-prev { left: 16px; }
.lightbox-next { right: 16px; }

@media (max-width: 520px) {
  .gallery-grid { column-count: 1; }
  .page-title   { font-size: 20px; }
  .lightbox-prev { left: 4px; }
  .lightbox-next { right: 4px; }
}

<script>
(function () {
  'use strict';

  // ── Fade in ────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function () {
    document.body.classList.add('loaded');
  });

  // ── Filter ────────────────────────────────────────
  const filterBtns   = document.querySelectorAll('.filter-btn');
  const galleryItems = document.querySelectorAll('.gallery-item');
  const countEl      = document.getElementById('visible-count');

  filterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      const filter = this.dataset.filter;

      filterBtns.forEach(function (b) { b.classList.remove('active'); });
      this.classList.add('active');

      let visible = 0;
      galleryItems.forEach(function (item) {
        if (filter === 'all' || item.dataset.category === filter) {
          item.classList.remove('hidden');
          visible++;
        } else {
          item.classList.add('hidden');
        }
      });

      countEl.textContent = visible;
    });
  });

  // ── Lightbox ──────────────────────────────────────
  const lightbox     = document.getElementById('lightbox');
  const lbImg        = document.getElementById('lightbox-img');
  const lbTitle      = document.getElementById('lightbox-title');
  const lbMeta       = document.getElementById('lightbox-meta');
  const lbClose      = document.getElementById('lightbox-close');
  const lbPrev       = document.getElementById('lightbox-prev');
  const lbNext       = document.getElementById('lightbox-next');

  let currentItems = [];
  let currentIndex = 0;

  function getVisibleFrames() {
    return Array.from(
      document.querySelectorAll('.gallery-item:not(.hidden) .drawing-frame')
    );
  }

  function showImage(idx) {
    const frame = currentItems[idx];
    hideLens();
    lbImg.src   = frame.dataset.src;
    lbImg.alt   = frame.querySelector('img').alt;
    lbTitle.textContent = frame.dataset.title;
    lbMeta.textContent  = frame.dataset.meta;
  }

  function openLightbox(clickedFrame) {
    currentItems = getVisibleFrames();
    currentIndex = currentItems.indexOf(clickedFrame);
    if (currentIndex === -1) currentIndex = 0;
    showImage(currentIndex);
    lightbox.classList.add('is-open');
    document.body.style.overflow = 'hidden';
    lbClose.focus();
    if (window.appInsights) {
      window.appInsights.trackEvent({ name: 'T Shirt Design Opened', properties: { title: clickedFrame.dataset.title, meta: clickedFrame.dataset.meta } });
    }
  }

  function closeLightbox() {
    hideLens();
    lightbox.classList.remove('is-open');
    document.body.style.overflow = '';
    lbImg.src = '';
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + currentItems.length) % currentItems.length;
    showImage(currentIndex);
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % currentItems.length;
    showImage(currentIndex);
  }

  // Open on frame click
  document.querySelectorAll('.drawing-frame').forEach(function (frame) {
    frame.addEventListener('click', function () { openLightbox(this); });
    frame.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(this); }
    });
    frame.setAttribute('tabindex', '0');
    frame.setAttribute('role', 'button');
  });

  // ── Magnifier ─────────────────────────────────────
  const lens      = document.getElementById('magnifier');
  let zoom = 3;

  function moveLens(clientX, clientY) {
    const rect = lbImg.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    if (x < 0 || y < 0 || x > rect.width || y > rect.height) { hideLens(); return; }
    lens.classList.add('is-active');
    const half = lens.offsetWidth / 2;
    lens.style.left = (x - half) + 'px';
    lens.style.top  = (y - half) + 'px';
    lens.style.backgroundImage    = 'url("' + lbImg.src + '")';
    lens.style.backgroundSize     = (rect.width * zoom) + 'px ' + (rect.height * zoom) + 'px';
    lens.style.backgroundPosition = (half - x * zoom) + 'px ' + (half - y * zoom) + 'px';
  }

  function hideLens() { lens.classList.remove('is-active'); }

  lbImg.addEventListener('mousemove', function (e) { moveLens(e.clientX, e.clientY); });
  lbImg.addEventListener('mouseleave', hideLens);
  lbImg.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoom = Math.min(6, Math.max(2, zoom + (e.deltaY < 0 ? 0.5 : -0.5)));
    moveLens(e.clientX, e.clientY);
  }, { passive: false });
  lbImg.addEventListener('touchstart', function (e) { moveLens(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  lbImg.addEventListener('touchmove', function (e) {
    e.preventDefault();
    moveLens(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  lbImg.addEventListener('touchend', hideLens);

  lbClose.addEventListener('click', closeLightbox);
  lbPrev.addEventListener('click',  prevImage);
  lbNext.addEventListener('click',  nextImage);

  // Click backdrop to close
  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox) closeLightbox();
  });

  // Keyboard navigation
  document.addEventListener('keydown', function (e) {
    if (!lightbox.classList.contains('is-open')) return;
    if (e.key === 'Escape')     closeLightbox();
    if (e.key === 'ArrowLeft')  prevImage();
    if (e.key === 'ArrowRight') nextImage();
  });

}());
</script>
</body>
</html>

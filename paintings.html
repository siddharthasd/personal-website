<style>
:root {
  --gold:           #C49A1A;
  --gold-light:     #E8D5A0;
  --ink:            #1C1712;
  --parchment:      #FAF7F0;
  --parchment-mid:  #F2EBE0;
  --parchment-dark: #E6DDD0;
  --text:           #2A2118;
  --text-muted:     #6B5848;
  --green:          #7DBF8E;
  --green-dark:     #4E8C5F;
  --violet:         #A89BC9;
  --violet-dark:    #6B5A9E;
  --border:         #D4C9B0;
  --mat:            #F5F0E8;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; }

body {
  background: var(--parchment);
  color: var(--text);
  font-family: Georgia, 'Times New Roman', serif;
  opacity: 0;
  transition: opacity 0.7s ease;
}
body.loaded { opacity: 1; }

/* ─── HEADER ──────────────────────────────────────── */
.site-header {
  background: var(--ink);
  padding: 16px 48px;
  position: relative;
  overflow: hidden;
}
.site-header::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(0deg,  transparent, transparent 19px, rgba(196,154,26,0.05) 20px),
    repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(196,154,26,0.05) 20px);
  pointer-events: none;
}
.header-inner {
  position: relative; z-index: 1;
  display: flex;
  align-items: center;
  gap: 16px;
}
.medallion-link { display: flex; flex-shrink: 0; }
.medallion { width: 48px; height: 48px; }
.brand-text { flex: 1; }
.page-title {
  font-family: Georgia, serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--gold-light);
  letter-spacing: 0.07em;
  line-height: 1.2;
}
.page-subtitle {
  font-family: Georgia, serif;
  font-size: 11px;
  color: rgba(232,213,160,0.5);
  letter-spacing: 0.2em;
  font-style: italic;
  margin-top: 2px;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold-light);
  text-decoration: none;
  border: 1px solid rgba(196,154,26,0.35);
  padding: 5px 12px;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
  flex-shrink: 0;
}
.back-link:hover {
  background: rgba(196,154,26,0.15);
  border-color: rgba(196,154,26,0.7);
  color: #fff;
}
.back-link::before { content: '←'; font-size: 13px; }

/* ─── FOOTER ──────────────────────────────────────── */
.site-footer {
  background: var(--ink);
  color: rgba(232,213,160,0.5);
  text-align: center;
  padding: 44px 40px;
  font-family: Georgia, serif;
  font-size: 13px;
  font-style: italic;
  letter-spacing: 0.07em;
  line-height: 2.2;
}
.site-footer a {
  color: rgba(232,213,160,0.72);
  text-decoration: none;
  transition: color 0.2s;
}
.site-footer a:hover { color: var(--gold-light); }
.footer-rule {
  width: 80px;
  height: 1px;
  background: rgba(196,154,26,0.35);
  margin: 16px auto;
}

/* ─── FILTER BAR ──────────────────────────────────── */
.filter-section {
  background: var(--parchment-mid);
  border-bottom: 1px solid var(--border);
  padding: 24px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.filter-bar {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.filter-btn {
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 7px 16px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  cursor: pointer;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
  line-height: 1;
}
.filter-btn:hover {
  border-color: var(--gold);
  color: var(--text);
}
.filter-btn.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--gold-light);
}

.gallery-count {
  font-family: Georgia, serif;
  font-size: 13px;
  font-style: italic;
  color: var(--text-muted);
  white-space: nowrap;
}

/* ─── GALLERY ─────────────────────────────────────── */
.gallery-wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 40px 64px;
}

.gallery-grid {
  column-count: 3;
  column-gap: 24px;
}

.gallery-item {
  break-inside: avoid;
  margin-bottom: 24px;
}
.gallery-item.hidden {
  display: none;
}

/* ─── PICTURE FRAME ───────────────────────────────── */
.painting-frame {
  background: var(--mat);
  border: 1px solid var(--border);
  cursor: zoom-in;
  position: relative;
  box-shadow: 2px 3px 10px rgba(28,23,18,0.13);
  transition: box-shadow 0.25s ease, transform 0.25s ease;
}
.painting-frame:hover {
  box-shadow: 5px 8px 28px rgba(28,23,18,0.22);
  transform: translateY(-2px);
}

/* Gold corner brackets */
.painting-frame::before,
.painting-frame::after {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  border-color: var(--gold);
  border-style: solid;
  opacity: 0.5;
  z-index: 2;
  pointer-events: none;
}
.painting-frame::before { top: 6px; left: 6px; border-width: 1.5px 0 0 1.5px; }
.painting-frame::after  { bottom: 34px; right: 6px; border-width: 0 1.5px 1.5px 0; }

/* Parchment mat */
.painting-mat {
  padding: 12px 12px 10px;
  position: relative;
  overflow: hidden;
}

.painting-mat::before {
  content: '';
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(196,154,26,0.18);
  pointer-events: none;
  z-index: 1;
}

.painting-mat img {
  width: 100%;
  height: auto;
  display: block;
  transition: transform 0.3s ease;
}

/* Hover overlay */
.painting-overlay {
  position: absolute;
  inset: 12px 12px 10px;
  background: rgba(28,23,18,0.48);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.25s ease;
}
.painting-overlay span {
  font-family: Georgia, serif;
  font-size: 13px;
  font-style: italic;
  letter-spacing: 0.18em;
  color: var(--gold-light);
  border-bottom: 1px solid rgba(232,213,160,0.5);
  padding-bottom: 3px;
}
.painting-frame:hover .painting-overlay { opacity: 1; }
.painting-frame:hover .painting-mat img { transform: scale(1.02); }

/* Caption */
figcaption {
  padding: 8px 14px 12px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 6px;
  flex-wrap: wrap;
}
.caption-title {
  font-family: Georgia, serif;
  font-size: 13px;
  font-style: italic;
  color: var(--text);
  flex: 1;
}
.caption-series {
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 2px;
}
.caption-series--landscape  { background: var(--parchment-dark); color: var(--green-dark); }
.caption-series--still-life { background: #EDE2F5; color: #6B4F9E; }
.caption-series--postcard   { background: #D6EFDB; color: var(--green-dark); }
.caption-series--portrait   { background: #F5EDCE; color: #8A6D0A; }
.caption-year {
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.1em;
  white-space: nowrap;
}

/* ─── LIGHTBOX ────────────────────────────────────── */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.lightbox.open { display: flex; }

.lightbox-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(28,23,18,0.93);
  cursor: zoom-out;
}

.lightbox-content {
  position: relative;
  z-index: 1;
  max-width: 90vw;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.lightbox-img {
  max-width: 100%;
  max-height: 80vh;
  object-fit: contain;
  box-shadow: 0 8px 48px rgba(0,0,0,0.6);
}

.lightbox-info {
  text-align: center;
}
.lightbox-info strong {
  display: block;
  font-family: Georgia, serif;
  font-size: 16px;
  font-style: italic;
  color: var(--gold-light);
  margin-bottom: 4px;
}
.lightbox-info span {
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 12px;
  color: rgba(232,213,160,0.55);
  letter-spacing: 0.14em;
}

.lightbox-close {
  position: fixed;
  top: 20px; right: 24px;
  background: none;
  border: none;
  color: rgba(232,213,160,0.7);
  font-size: 28px;
  cursor: pointer;
  line-height: 1;
  padding: 4px 8px;
  transition: color 0.2s;
  z-index: 1001;
}
.lightbox-close:hover { color: #fff; }

.lightbox-prev,
.lightbox-next {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(28,23,18,0.5);
  border: 1px solid rgba(196,154,26,0.25);
  color: var(--gold-light);
  font-size: 22px;
  padding: 12px 16px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
  z-index: 1001;
  line-height: 1;
}
.lightbox-prev:hover,
.lightbox-next:hover {
  background: rgba(196,154,26,0.15);
  border-color: rgba(196,154,26,0.6);
}
.lightbox-prev { left: 16px; }
.lightbox-next { right: 16px; }

@media (max-width: 520px) {
  .gallery-grid { column-count: 1; }
  .page-title   { font-size: 20px; }
  .lightbox-prev { left: 4px; }
  .lightbox-next { right: 4px; }
}

<script>
(function () {
  'use strict';

  document.addEventListener('DOMContentLoaded', function () {
    document.body.classList.add('loaded');
  });

  // ── Filter ───────────────────────────────────────
  var filterBtns   = document.querySelectorAll('.filter-btn');
  var galleryItems = document.querySelectorAll('.gallery-item');
  var countEl      = document.getElementById('visible-count');

  filterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var filter = this.dataset.filter;
      filterBtns.forEach(function (b) { b.classList.remove('active'); });
      this.classList.add('active');
      var visible = 0;
      galleryItems.forEach(function (item) {
        if (filter === 'all' || item.dataset.category === filter) {
          item.classList.remove('hidden');
          visible++;
        } else {
          item.classList.add('hidden');
        }
      });
      countEl.textContent = visible;
    });
  });

  // ── Lightbox ─────────────────────────────────────
  var lightbox = document.getElementById('lightbox');
  var lbImg    = document.getElementById('lightbox-img');
  var lbTitle  = document.getElementById('lightbox-title');
  var lbMeta   = document.getElementById('lightbox-meta');
  var lbClose  = document.getElementById('lightbox-close');
  var lbPrev   = document.getElementById('lightbox-prev');
  var lbNext   = document.getElementById('lightbox-next');

  var currentItems = [];
  var currentIndex = 0;

  function getVisibleFrames() {
    return Array.from(
      document.querySelectorAll('.gallery-item:not(.hidden) .painting-frame')
    );
  }

  function showImage(idx) {
    var frame = currentItems[idx];
    lbImg.src            = frame.dataset.src;
    lbImg.alt            = frame.querySelector('img').alt;
    lbTitle.textContent  = frame.dataset.title;
    lbMeta.textContent   = frame.dataset.meta;
  }

  function openLightbox(clickedFrame) {
    currentItems = getVisibleFrames();
    currentIndex = currentItems.indexOf(clickedFrame);
    if (currentIndex === -1) currentIndex = 0;
    showImage(currentIndex);
    lightbox.classList.add('is-open');
    document.body.style.overflow = 'hidden';
    lbClose.focus();
  }

  function closeLightbox() {
    lightbox.classList.remove('is-open');
    document.body.style.overflow = '';
    lbImg.src = '';
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + currentItems.length) % currentItems.length;
    showImage(currentIndex);
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % currentItems.length;
    showImage(currentIndex);
  }

  document.querySelectorAll('.painting-frame').forEach(function (frame) {
    frame.addEventListener('click', function () { openLightbox(this); });
    frame.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(this); }
    });
    frame.setAttribute('tabindex', '0');
    frame.setAttribute('role', 'button');
  });

  lbClose.addEventListener('click', closeLightbox);
  lbPrev.addEventListener('click',  prevImage);
  lbNext.addEventListener('click',  nextImage);

  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', function (e) {
    if (!lightbox.classList.contains('is-open')) return;
    if (e.key === 'Escape')     closeLightbox();
    if (e.key === 'ArrowLeft')  prevImage();
    if (e.key === 'ArrowRight') nextImage();
  });

}());
</script>
